name: Keep AuraVision AI Render Service Awake

on:
  schedule:
    # GitHub Actions supports a 5-minute minimum schedule interval.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: auravision-render-keepalive
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping AuraVision AI backend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-time 25 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            --output /tmp/auravision-health-response.txt \
            --write-out "HTTP status: %{http_code}\n" \
            https://auravisionai-docker.onrender.com/
          cat /tmp/auravision-health-response.txt
