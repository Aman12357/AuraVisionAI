name: Keep AuraVision AI Render Service Awake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-keepalive.yml"
  schedule:
    # GitHub Actions schedules run no more frequently than every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: auravision-render-keepalive
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check AuraVision AI backend and database
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-time 25 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            --output /tmp/auravision-health-response.txt \
            --write-out "HTTP status: %{http_code}\n" \
            https://auravisionai-docker.onrender.com/api/health
          cat /tmp/auravision-health-response.txt
