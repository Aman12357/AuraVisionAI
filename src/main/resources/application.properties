server.port=8080
spring.application.name=auravision

# Gemini API. The key is read from the environment and never sent to the browser.
gemini.api-key=${GEMINI_API_KEY:}
gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
gemini.video-model=${GEMINI_VIDEO_MODEL:veo-3.1-generate-preview}

# Generated files live on disk; metadata lives in the database
app.storage-dir=${STORAGE_DIR:./storage}
# Max generations a single visitor can have running at once
app.max-active-jobs=2

# Database: embedded H2 file by default (zero setup).
# For PostgreSQL run with: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/auravision;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100

# Return error messages to the frontend (shown in the Studio and checkout)
server.error.include-message=always
